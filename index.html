<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Phoebe Ducante</title>
  </head>
  <body>
    <nav>
      <div class="nav-links">
        <a href="#about">About & Experience</a>
        <a href="#home" class="nav-logo">Phoebe Ducante</a>
        <a href="#contacts">Contacts</a>

        <button
          type="button"
          class="side-bar-btn"
          onclick="openSideBar()"
          aria-label="Open navigation menu"
        >
          <img src="icons/menu.png" alt="" />
        </button>
      </div>

      <div class="side-bar" id="side-bar">
        <button
          type="button"
          class="close-side-bar"
          onclick="closeSideBar()"
          aria-label="Close navigation menu"
        >
          <img src="icons/close.png" alt="" />
        </button>

        <div class="side-bar-links">
          <a href="#about" onclick="closeSideBar()">About & Experience</a>
          <a href="#home" onclick="closeSideBar()">Phoebe Ducante</a>
          <a href="#contacts" onclick="closeSideBar()">Contacts</a>
        </div>
      </div>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
